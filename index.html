            levantamentos: {
                title: 'Levantamentos', icon: "📸", desc: 'As-Built e captura de realidade via IA.',
                tools: [
            { name: "OpenSpace", description: "Mapeamento BIM via câmera 360.", fullAnalysis: "**Definir o problema - o que queremos resolver?**\nDocumentar o avanço físico do canteiro de forma sistemática e automatizada, eliminando a dependência de registros fotográficos manuais e descentralizados das equipes de campo.\n\n**Exemplo**\nEm uma obra de edifício corporativo de 20 andares, o engenheiro fiscal precisa registrar semanalmente o avanço de fechamento de drywall em cada pavimento, vinculando as fotos ao modelo BIM para comparação com o projeto executivo.\n\n**Testes da ferramenta**\nO OpenSpace utiliza câmeras 360° acopladas ao capacete do profissional de campo. Durante o simples caminhar pelo canteiro, a IA processa o vídeo capturado e posiciona automaticamente cada imagem na planta baixa correspondente — sem necessidade de parar para fotografar ou marcar posições manualmente.\n\nO módulo OpenSpace Track detecta automaticamente materiais instalados (drywall, estruturas metálicas, concreto aparente) e calcula percentuais de avanço físico por atividade. A comparação lado a lado entre a foto real e o modelo BIM facilita a identificação de não conformidades.\n\n**Tirar conclusões**\nFerramenta de alto impacto para fiscalização de obras de média e grande complexidade. Reduz drasticamente o tempo de documentação de campo e cria um histórico visual incontestável do canteiro. O custo sob consulta é a principal barreira de avaliação inicial.", url: "https://www.openspace.ai/", matrix: { impacto: 7, facilidade_de_uso: 7, integracao: 6, custo_beneficio: 3, escalabilidade: 5.5 } },
            { name: "Matterport", description: "Digital Twins de alta fidelidade.", fullAnalysis: "**Definir o problema - o que queremos resolver?**\nCriar gêmeos digitais fotorrealistas de ambientes construídos para documentação de as-built, visitas virtuais a clientes e levantamento dimensional remoto, sem necessidade de visita técnica presencial para cada consulta.\n\n**Exemplo**\nUma empresa de facilities management precisa documentar todos os ambientes de um edifício corporativo para o cadastro de manutenção. O Matterport cria um tour virtual navegável e exporta plantas baixas automaticamente a partir da captura 3D.\n\n**Testes da ferramenta**\nO Matterport captura ambientes com câmeras 3D proprietárias (Pro3) ou smartphones compatíveis, gerando modelos de nuvem de pontos e tours virtuais em 360°. O processamento na nuvem é automático, disponibilizando o modelo navegável em horas após a captura.\n\nA extração de plantas baixas 2D e seções do modelo 3D é funcional para documentação de as-built, embora a precisão dimensional (±1-2 cm) possa ser insuficiente para projetos de reforma que exigem levantamento de alta exatidão. Integra-se com plataformas como Autodesk Construction Cloud e Procore.\n\n**Tirar conclusões**\nExcelente para documentação de as-built, entrega de obras e gestão de facilities. A combinação de tour virtual, extração de plantas e medições remotas entrega valor real para equipes de projeto e gestão de ativos. Para levantamentos de alta precisão, FARO ou scanners laser dedicados são mais adequados.", url: "https://matterport.com/", matrix: { impacto: 7, facilidade_de_uso: 8, integracao: 6, custo_beneficio: 3, escalabilidade: 4 } },
            { name: "FARO Technologies", description: "Scanners Laser Industriais.", fullAnalysis: "**Definir o problema - o que queremos resolver?**\nRealizar levantamentos dimensionais de altíssima precisão em estruturas existentes, instalações industriais e patrimônios históricos para as-built BIM, controle geométrico de estruturas e inspeção dimensional.\n\n**Exemplo**\nUma planta industrial precisa de reforma estrutural. Antes de projetar as intervenções, a equipe de engenharia realiza o scan laser completo da instalação, gerando uma nuvem de pontos milimétrica que serve de base para o modelo BIM as-built, eliminando erros de levantamento manual.\n\n**Testes da ferramenta**\nOs scanners FARO Focus capturam nuvens de pontos com precisão de ±1 mm a distâncias de até 300 m. O software FARO Scene processa e registra as varreduras, gerando arquivos compatíveis com Revit, AutoCAD, Navisworks e Trimble Connect para modelagem BIM a partir da nuvem de pontos.\n\nA operação exige treinamento específico e o custo de aquisição do hardware é elevado, justificando o modelo de prestação de serviços por empresas especializadas. O tempo de processamento de projetos complexos pode ser significativo dependendo do volume de dados capturados.\n\n**Tirar conclusões**\nReferência de mercado para levantamentos de alta precisão em contextos onde o erro dimensional tem consequência direta (instalações industriais, estruturas históricas, controle de qualidade de obras). Para a maioria dos projetos de edificações convencionais, soluções como Matterport ou OpenSpace oferecem custo-benefício mais adequado.", url: "https://www.faro.com/pt-BR", matrix: { impacto: 8, facilidade_de_uso: 4, integracao: 8, custo_beneficio: 3, escalabilidade: 5.5 } }
        ]
            },
            vistorias: {
                title: 'Vistorias', icon: "🔍", desc: 'Digitalização e inspeção LiDAR móvel.',
                tools: [
            { name: "DroneDeploy", description: "Drones e Fotogrametria 3D.", fullAnalysis: "**Definir o problema - o que queremos resolver?**\nDocumentar e monitorar o avanço de obras e terrenos por meio de fotogrametria aérea, gerando mapas, modelos 3D e medições volumétricas precisas a partir de voos de drone automatizados.\n\n**Exemplo**\nUma construtora precisa monitorar mensalmente o avanço de escavação de um empreendimento e calcular o volume de terra removido para controle de pagamento de empreiteiros. O DroneDeploy automatiza o voo, processa as imagens e gera o cálculo volumétrico comparativo entre os levantamentos.\n\n**Testes da ferramenta**\nO DroneDeploy é a plataforma líder de fotogrametria para construção civil, combinando planejamento automatizado de voo, processamento de imagens na nuvem e geração de ortomosaicos, modelos 3D e nuvens de pontos. A IA analisa as imagens para identificar progresso de obra, detectar equipamentos e gerar relatórios de avanço físico.\n\nA integração com plataformas de gestão de construção (Procore, Autodesk Construction Cloud) permite vincular os dados de drone ao modelo BIM e ao cronograma da obra. O app mobile simplifica a operação em campo, tornando o voo acessível para equipes sem especialização em fotogrametria.\n\nO custo elevado é a principal barreira — o plano mais básico custa USD 499/mês, o que demanda análise criteriosa do volume de uso para justificar o investimento.\n\n**Tirar conclusões**\nFerramenta de alto impacto para obras de grande porte com necessidade de monitoramento aéreo regular — terraplanagem, infraestrutura, grandes empreendimentos residenciais. Para obras urbanas convencionais de pequeno e médio porte, o custo pode não se justificar frente a serviços pontuais de fotogrametria terceirizada.", url: "https://www.dronedeploy.com/", matrix: { impacto: 8, facilidade_de_uso: 7, integracao: 5, custo_beneficio: 3, escalabilidade: 4 } },
            { name: "HoloBuilder (Autodesk)", description: "Captura espacial 360.", fullAnalysis: "**Definir o problema - o que queremos resolver?**\nDocumentar visualmente o avanço de obras com captura 360° sistemática, criando um registro navegável do canteiro ao longo do tempo para acompanhamento remoto, fiscalização e resolução de disputas.\n\n**Exemplo**\nUm cliente residente em outra cidade precisa acompanhar semanalmente o avanço de sua obra sem visitas presenciais. O HoloBuilder cria um tour virtual 360° atualizado após cada visita de registro, acessível remotamente com visualização comparativa entre datas.\n\n**Testes da ferramenta**\nO HoloBuilder (agora parte do ecossistema Autodesk Construction Cloud após aquisição) permite captura de tours virtuais 360° com câmeras de uso geral e organiza as imagens em uma linha do tempo navegável vinculada à planta baixa do projeto.\n\nA comparação temporal — ver o mesmo ponto do canteiro em diferentes datas com um clique — é o diferencial principal para fiscalização e documentação de avanço. A integração com o ACC facilita o vínculo das imagens com o modelo BIM e os registros de issues.\n\nPara equipes já no ecossistema Autodesk, o HoloBuilder agrega documentação visual sem custo adicional de plataforma. A qualidade da captura depende da câmera utilizada pelo usuário.\n\n**Tirar conclusões**\nBoa opção para documentação de obras com acompanhamento remoto, especialmente para equipes no ecossistema Autodesk. Para análise automática de avanço físico por IA (detecção de materiais instalados), o OpenSpace oferece funcionalidade mais avançada.", url: "https://www.holobuilder.com/", matrix: { impacto: 6, facilidade_de_uso: 7, integracao: 6, custo_beneficio: 3, escalabilidade: 5 } },
            { name: "Twindo", description: "Scan-to-BIM LiDAR (iOS).", fullAnalysis: "**Definir o problema - o que queremos resolver?**\nRealizar levantamentos Scan-to-BIM de ambientes internos com rapidez e baixo custo utilizando o LiDAR do iPhone/iPad, gerando modelos BIM básicos a partir de capturas de campo sem necessidade de equipamentos especializados.\n\n**Exemplo**\nUm arquiteto precisa levantar as dimensões de um apartamento para um projeto de reforma. Em vez de medir manualmente com trena, utiliza o Twindo no iPad para capturar o ambiente em minutos e exportar as dimensões e uma planta básica.\n\n**Testes da ferramenta**\nO Twindo (anteriormente Canvas.io) utiliza o sensor LiDAR presente nos modelos recentes de iPhone e iPad Pro para realizar varreduras 3D de ambientes internos. O processamento na nuvem gera plantas baixas, seções e modelos IFC básicos a partir da captura.\n\nA precisão do LiDAR do iPhone (±1-2 cm em ambientes de até ~9m) é adequada para levantamentos de reforma e projetos de interiores, mas insuficiente para as-built de engenharia que exigem alta exatidão. A acessibilidade é o grande diferencial — qualquer profissional com iPhone Pro pode usar a ferramenta.\n\n**Tirar conclusões**\nExcelente para arquitetos e projetistas de interiores que precisam de levantamentos rápidos com precisão razoável. Democratiza o Scan-to-BIM para o cotidiano de projetos de menor escala. Para obras industriais ou levantamentos de alta precisão, scanners laser dedicados (FARO, Leica) seguem sendo necessários.", url: "https://canvas.io/", matrix: { impacto: 6, facilidade_de_uso: 8, integracao: 5, custo_beneficio: 3, escalabilidade: 6 } }
        ]
            },
            cde: {
                title: 'CDE', icon: "☁️", desc: 'Gestão centralizada de modelos e dados BIM.',
                tools: [
            { name: "Trimble Connect", description: "CDE focado em coordenação visual.", fullAnalysis: "**Definir o problema - o que queremos resolver?**\nCentralizar modelos, documentos e apontamentos de projetos multidisciplinares em um único ambiente acessível a todas as partes envolvidas — projetistas, construtores, clientes e fiscalizadores — sem depender de troca de arquivos por e-mail.\n\n**Exemplo**\nUma construtora gerencia 5 projetos simultâneos com arquitetos, engenheiros de estrutura e instalações em escritórios diferentes. O Trimble Connect centraliza os modelos IFC de cada disciplina, permite a visualização federada e o registro de issues vinculados ao modelo, acessíveis por todos via web ou app mobile no canteiro.\n\n**Testes da ferramenta**\nO Trimble Connect é um CDE maduro com foco em coordenação visual de modelos BIM. Suporta IFC, RVT, DWG e nuvem de pontos, permitindo a federação de modelos de múltiplas disciplinas em um único visualizador 3D na nuvem.\n\nO sistema de issues e anotações é vinculado diretamente aos elementos do modelo, com exportação em BCF. A integração com o ecossistema Trimble (Total Stations, GPS, Tekla Structures) é um diferencial para obras com uso intensivo de hardware de topografia e estruturas metálicas.\n\nA curva de aprendizado é moderada. A interface, embora funcional, é considerada menos intuitiva que concorrentes como Revizto para usuários sem experiência prévia em plataformas BIM colaborativas.\n\n**Tirar conclusões**\nBoa opção para empresas que já utilizam hardware ou software Trimble, aproveitando a integração nativa do ecossistema. Para equipes sem essa dependência, o custo-benefício frente a alternativas como Revizto ou AltoQi Visus Collab deve ser avaliado conforme o perfil do projeto.", url: "https://connect.trimble.com/", matrix: { impacto: 8, facilidade_de_uso: 8, integracao: 8, custo_beneficio: 3, escalabilidade: 4 } },
            { name: "Autodesk Forma", description: "Coordenação em nuvem AEC.", fullAnalysis: "**Definir o problema - o que queremos resolver?**\nIntegrar análises de desempenho — vento, insolação, ruído, carbono — ao processo de projeto arquitetônico ainda nas fases iniciais, permitindo decisões de forma e implantação baseadas em dados antes do desenvolvimento detalhado.\n\n**Exemplo**\nDurante o estudo de viabilidade de um empreendimento residencial, o arquiteto usa o Autodesk Forma para simular o impacto do sombreamento de torres vizinhas sobre a insolação das unidades, ajustando a implantação antes de iniciar o anteprojeto.\n\n**Testes da ferramenta**\nO Autodesk Forma é uma plataforma de projeto generativo e análise ambiental em nuvem, posicionada para as fases de concepção e estudo preliminar. Integra-se nativamente ao Revit, permitindo que modelos de massa sejam analisados e refinados antes da modelagem BIM detalhada.\n\nAs análises de micromicroclima (vento CFD), radiação solar, daylight e carbono incorporado são geradas diretamente na plataforma sem necessidade de exportação para softwares especializados. O fluxo com o Revit 2027 é aprimorado, com troca bidirecional de dados via nuvem Autodesk.\n\nA limitação principal é o foco em análises de escala urbana e de implantação — não substitui ferramentas de análise energética detalhada (EnergyPlus, IES VE) para projetos que exigem certificações como LEED ou AQUA.\n\n**Tirar conclusões**\nFerramenta estratégica para escritórios que trabalham com projetos urbanos ou empreendimentos de grande escala e precisam embasar decisões de implantação com dados de desempenho. Para equipes no ecossistema Autodesk, a integração com Revit e ACC agrega valor sem custo adicional na AEC Collection.", url: "https://www.autodesk.com/products/forma/overview", matrix: { impacto: 7, facilidade_de_uso: 7, integracao: 6, custo_beneficio: 3, escalabilidade: 9 } },
            {
                name: "Revizto",
                description: "Plataforma de coordenação BIM baseada na engine Unity, unificando modelos 3D, pranchas 2D e rastreamento de interferências em um único ambiente colaborativo com suporte nativo a BCF e VR.",
                fullAnalysis: "**Definir o problema - o que queremos resolver?**\nDesorganização na gestão de interferências e falta de rastreabilidade no ciclo de resolução de clashes em projetos multidisciplinares, onde as incompatibilidades identificadas em reuniões de coordenação se perdem sem registro formal, responsável ou prazo definido.\n\n**Exemplo**\nDurante a compatibilização de um edifício hospitalar com múltiplas disciplinas (estrutura, hidráulica, HVAC, elétrica), o coordenador BIM precisa registrar cada interferência detectada, atribuir ao responsável da disciplina, acompanhar a resolução e documentar o histórico de decisões — tudo vinculado ao elemento 3D e à prancha 2D correspondente.\n\n**Testes da ferramenta**\nO Revizto é construído sobre a engine Unity, o que lhe confere desempenho excepcional para navegar modelos federados de grande porte — um diferencial direto frente ao Navisworks em projetos com arquivos pesados. A visualização combina o modelo 3D com as pranchas 2D em tela dividida, permitindo localizar qualquer interferência simultaneamente no espaço e no desenho técnico.\n\nO sistema de Issue Tracker é o núcleo da plataforma: cada interferência recebe classificação, responsável, prazo, status e histórico de comentários, com exportação em formato BCF (padrão aberto openBIM). O rastreamento em tempo real reduz a dependência de atas de reunião para registro de encaminhamentos.\n\nA integração é ampla: Revit, Navisworks, SketchUp, ArchiCAD, Rhino, IFC, FBX e nuvem de pontos. Conecta-se a CDEs externos como Autodesk Construction Cloud, Procore, Box e SharePoint via API (disponível no plano Revizto+). O acesso mobile permite uso direto no canteiro de obras para registro de não conformidades.\n\nPonto de atenção: usuários relatam lentidão ao operar modelos muito grandes no modo VR. Adicionalmente, o Revizto não é um CDE completo por si só — não possui repositório centralizado de documentação de projeto, necessitando integração com ACC ou Trimble Connect para cobrir essa lacuna. A curva de aprendizado para configuração avançada (filtros, automações, dashboards Power BI via Revizto+) é relevante para equipes sem experiência prévia em plataformas de coordenação.\n\n**Tirar conclusões**\nO Revizto é a referência de mercado para coordenação BIM e gestão de interferências em projetos de alta complexidade. Seu principal valor é a rastreabilidade completa do ciclo de clash — da detecção à resolução — com documentação vinculada ao modelo. Para equipes Fox que já realizam compatibilização BIM, representa um salto significativo na formalização do processo e na redução de retrabalho em obra.",
                url: "https://revizto.com/",

                fullAnalysis: "**Definir o problema - o que queremos resolver?**\nSituações em que adicionar um bot participante à reunião é inadequado — reuniões com clientes sensíveis, licitações, vistorias técnicas online — mas ainda é necessário registrar o conteúdo discutido.\n\n**Exemplo**\nUma reunião de entrega de laudo técnico a um cliente que não autorizou gravação explícita. O Tactiq transcreve via extensão do navegador sem adicionar nenhum participante visível, garantindo discrição e registro simultâneo.\n\n**Testes da ferramenta**\nO Tactiq opera como extensão do Chrome, capturando as legendas ao vivo geradas pelas próprias plataformas (Meet, Zoom, Teams) e convertendo-as em transcrição estruturada. Isso elimina o bot participante, tornando a captura invisível para os demais.\n\nApós a reunião, a IA gera resumo, itens de ação e pode exportar diretamente para Google Docs, Notion, Slack, HubSpot ou Linear. O plano gratuito é limitado a 10 transcrições por mês — suficiente para times pequenos ou uso seletivo.\n\nA limitação principal é a dependência das legendas automáticas da plataforma, o que pode reduzir precisão em áudios com ruído ou sotaques regionais.\n\n**Tirar conclusões**\nIdeal para profissionais que precisam de discrição e não querem bots visíveis. O fluxo de exportação para ferramentas de gestão é ágil. Para equipes com alto volume de reuniões ou necessidade de análise de conversação avançada, Fireflies.ai ou MeetGeek oferecem mais profundidade.",
                url: "https://tactiq.io/",
                matrix: { impacto: 6, facilidade_de_uso: 7, integracao: 6, custo_beneficio: 6, escalabilidade: 7 }
            },
            {
                name: "MeetGeek",
                description: "Assistente completo de reuniões com templates customizáveis por tipo de reunião, resumos automatizados, insights de engajamento e follow-ups estruturados.",
                fullAnalysis: "**Definir o problema - o que queremos resolver?**\nPadronização da documentação de reuniões em empresas de engenharia — atas de kick-off, reuniões de progresso, vistorias técnicas e alinhamentos de disciplina cada qual exigindo um formato diferente de registro e follow-up.\n\n**Exemplo**\nUma gerenciadora de projetos que conduz reuniões semanais de progresso com 5 contratos simultâneos precisa que cada ata siga um template específico (status de prazo, pendências, próximos passos) e seja distribuída automaticamente aos stakeholders após a reunião.\n\n**Testes da ferramenta**\nO MeetGeek se destaca pelos templates customizáveis por tipo de reunião. É possível configurar formatos distintos para reunião de kick-off, revisão de projeto, alinhamento de disciplina ou reunião de obra — e o resumo gerado pela IA já vem estruturado naquele molde.\n\nA ferramenta entra automaticamente nas reuniões via bot, gera transcrição com identificação de falantes, e distribui o resumo por e-mail aos participantes ao final. O histórico fica indexado e pesquisável.\n\nOs insights de engajamento (tempo de fala por participante, tópicos mais recorrentes por projeto) são úteis para gestores que acompanham múltiplas equipes. A acurácia em português é consistente entre as opções testadas.\n\n**Tirar conclusões**\nMelhor opção para empresas que precisam padronizar e automatizar a documentação de reuniões em escala. Os templates customizáveis são o diferencial claro frente aos concorrentes. Indicado para gerenciadoras, coordenadores de múltiplos projetos e equipes que realizam alto volume de reuniões recorrentes com stakeholders externos.",
                url: "https://meetgeek.ai/",
                matrix: { impacto: 7, facilidade_de_uso: 7, integracao: 6, custo_beneficio: 6, escalabilidade: 6 }
            },
            {
                name: "Fathom",
                description: "Notetaker com plano gratuito genuinamente ilimitado (gravação, transcrição e armazenamento sem teto), resumos em 30 segundos e integração nativa com CRMs.",
                fullAnalysis: "**Definir o problema - o que queremos resolver?**\nCusto e burocracia de ferramentas de registro de reuniões que limitam minutos, cobram por recurso básico ou demandam configuração complexa — criando resistência de adoção nas equipes.\n\n**Exemplo**\nUm escritório de engenharia quer dar autonomia a todos os colaboradores para registrar suas reuniões sem gestão de cota ou aprovação de licença. O plano gratuito do Fathom resolve esse cenário sem custo.\n\n**Testes da ferramenta**\nO Fathom se diferencia pelo plano gratuito mais generoso do mercado: gravação ilimitada, transcrição ilimitada e armazenamento ilimitado — sem restrição de minutos, quantidade de reuniões ou duração. Isso remove qualquer barreira de adoção.\n\nOs resumos são gerados em cerca de 30 segundos após o encerramento da reunião, significativamente mais rápido que concorrentes que levam 5 a 15 minutos. A integração nativa com HubSpot e Salesforce — que sincroniza notas, itens de ação e contatos automaticamente — elimina até 20 minutos de entrada manual de dados por reunião para equipes comerciais.\n\nO Fathom entra nas reuniões como participante visível ('Fathom Notetaker'), o que garante transparência mas pode ser inadequado em contextos onde a gravação não é explicitamente autorizada. Não há app mobile — apenas acesso via browser.\n\nO plano Premium (USD 19/mês) adiciona resumos IA ilimitados, templates customizados e Ask Fathom para consultas ao histórico.\n\n**Tirar conclusões**\nMelhor escolha para equipes que querem máxima cobertura de reuniões sem custo inicial. O plano gratuito ilimitado é genuíno e sustentável para uso corporativo. Indicado para escritórios em fase de adoção de ferramentas de IA, onde o baixo atrito é mais importante que funcionalidades avançadas.",
                url: "https://fathom.video/",
                matrix: { impacto: 6, facilidade_de_uso: 7, integracao: 6, custo_beneficio: 7, escalabilidade: 6 }
            },
            {
                name: "Sonix",
                description: "Plataforma de transcrição de alta precisão para áudio e vídeo gravados, com suporte a 53+ idiomas, edição de transcrição e exportação em múltiplos formatos.",
                fullAnalysis: "**Definir o problema - o que queremos resolver?**\nTranscrição precisa de conteúdo técnico gravado — laudos ditados, entrevistas de vistoria, apresentações de projeto, webinars internos e reuniões registradas fora de plataformas de videoconferência — onde a qualidade da transcrição é crítica.\n\n**Exemplo**\nUm engenheiro de vistorias grava áudios de campo descrevendo patologias identificadas. O Sonix transcreve o áudio em texto estruturado e editável, que alimenta diretamente o relatório técnico sem retrabalho de digitação.\n\n**Testes da ferramenta**\nO Sonix tem abordagem diferente das demais ferramentas desta categoria: não é um notetaker de reuniões ao vivo, mas uma plataforma de transcrição de arquivos de áudio e vídeo já gravados. Isso o torna especialmente útil para conteúdos fora do fluxo de videoconferência.\n\nA acurácia é o principal ativo — o Sonix reporta até 99% de precisão em áudio limpo e suporta 53+ idiomas incluindo português. O editor de transcrição permite correções inline com sincronização ao áudio (clicar no texto reproduz o trecho correspondente).\n\nO modelo pay-as-you-go (USD 10/hora) é adequado para uso irregular — perícias, laudos, entrevistas pontuais — sem compromisso de assinatura mensal. O Premium (USD 22/mês) inclui horas ilimitadas e é indicado para equipes com volume constante.\n\nNão possui integração nativa com plataformas de reunião (Zoom, Meet, Teams) para captura ao vivo.\n\n**Tirar conclusões**\nFerramenta ideal para engenheiros que precisam transcrever conteúdo técnico gravado com alta fidelidade. Complementa as demais ferramentas desta categoria: onde Fireflies ou Fathom cobrem as reuniões ao vivo, o Sonix cobre laudos, auditorias, entrevistas e qualquer áudio fora do ambiente de videoconferência.",
                url: "https://sonix.ai/",
                matrix: { impacto: 5, facilidade_de_uso: 6, integracao: 4, custo_beneficio: 5, escalabilidade: 6 }
            }
        ]
            }
        };

        const CAT_ORDER = ["cad", "bim", "simulacoes", "renders", "quantitativo", "orcamento", "modelagens", "calculos", "estudos", "levantamentos", "vistorias", "cde", "gestao", "llms", "reunioes"];

        let activeChart = null, dashCharts = [];

        const getScore = (m) => { let s=0,c=0; for(const k in m){ if(typeof m[k]==='number'){s+=m[k];c++;} } return c>0?(s/c).toFixed(1):'X'; };
        const scoreColor = (sc) => { const n=parseFloat(sc); if(isNaN(n)||sc==='X')return 'bg-gray-400'; if(n>=6.1)return 'bg-green'; if(n>=3.6)return 'bg-yellow'; return 'bg-red'; };

        function buildNav() {
            const nav = document.getElementById('navigation');
            let html = `<div class="nav-item active" onclick="showDashboard()" id="nav-dash">📊 Visão Geral</div>`;
            CAT_ORDER.forEach(key => {
                const c = APP_DATA[key];
                html += `<div class="nav-item" id="nav-${key}" onclick="showCategory('${key}')">
                    <span>${c.icon} ${c.title}</span><span class="bg-white/30 px-2 rounded-full text-xs">${c.tools.length}</span>
                </div>`;
            });
            nav.innerHTML = html;
        }

        function setActiveNav(id) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            const el = document.getElementById(id);
            if (el) el.classList.add('active');
        }

        function showDashboard() {
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('category-view').classList.add('hidden');
            document.getElementById('analysis-view').classList.add('hidden');
            setActiveNav('nav-dash');
            renderDashboard();
            window.scrollTo(0,0);
        }

        function renderDashboard() {
            let totalTools=0, totalSum=0, catLabels=[], catCounts=[], catScores=[], flatTools=[], bestInCat=[];
            CAT_ORDER.forEach(key => {
                const cat = APP_DATA[key];
                catLabels.push(cat.title); catCounts.push(cat.tools.length);
                let catSum=0, bestScore=-1, bestName="";
                cat.tools.forEach(t => {
                    const sc = parseFloat(getScore(t.matrix));
                    totalTools++; totalSum+=sc; catSum+=sc;
                    flatTools.push({name:t.name, score:sc, category:cat.title, key});
                    if(sc>bestScore){ bestScore=sc; bestName=t.name; }
                });
                catScores.push((catSum/cat.tools.length).toFixed(1));
                bestInCat.push({category:cat.title, name:bestName, score:bestScore.toFixed(1), key});
            });
            flatTools.sort((a,b)=>b.score-a.score);

            document.getElementById('dashboard-view').innerHTML = `
                <header class="mb-10 border-b border-[#283141] pb-6">
                    <h2 class="text-4xl font-bold text-[#E53935]">Visão Geral e KPIs</h2>
                    <p class="mt-2 text-lg opacity-80">Dashboard consolidado com todas as ferramentas analisadas pela Fox Engenharia.</p>
                </header>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
                    <div class="kpi-card"><span class="kpi-value">${totalTools}</span><br><span class="opacity-70 text-sm font-medium uppercase tracking-wider">Ferramentas</span></div>
                    <div class="kpi-card"><span class="kpi-value">${CAT_ORDER.length}</span><br><span class="opacity-70 text-sm font-medium uppercase tracking-wider">Categorias</span></div>
                    <div class="kpi-card"><span class="kpi-value">${(totalSum/totalTools).toFixed(1)}</span><br><span class="opacity-70 text-sm font-medium uppercase tracking-wider">Média Global</span></div>
                    <div class="kpi-card"><span class="kpi-value text-2xl">${flatTools[0].name}</span><br><span class="opacity-70 text-sm font-medium uppercase tracking-wider">Maior Nota</span></div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-12">
                    <div class="bg-[#131821] p-6 rounded-xl border border-[#283141] shadow-lg">
                        <h3 class="text-lg font-semibold mb-6 text-center uppercase tracking-wider text-[#A0B3D9]">Distribuição por Categoria</h3>
                        <div class="chart-container"><canvas id="distChart"></canvas></div>
                    </div>
                    <div class="bg-[#131821] p-6 rounded-xl border border-[#283141] shadow-lg">
                        <h3 class="text-lg font-semibold mb-6 text-center uppercase tracking-wider text-[#A0B3D9]">Performance Média</h3>
                        <div class="chart-container"><canvas id="perfChart"></canvas></div>
                    </div>
                </div>
                <div class="bg-[#131821] p-6 rounded-xl border border-[#283141] mb-12 shadow-lg">
                    <h3 class="text-2xl font-bold text-[#E53935] mb-6 flex items-center"><span class="mr-3">🏆</span> Top 5 Ferramentas Globais</h3>
                    <div class="overflow-x-auto"><table class="w-full text-left">
                        <thead class="border-b border-[#283141] text-[#A0B3D9] text-xs uppercase tracking-wider">
                            <tr><th class="py-4 px-4">Ranking</th><th class="py-4">Ferramenta</th><th>Categoria</th><th class="text-right px-4">Nota Geral</th></tr>
                        </thead>
                        <tbody class="divide-y divide-[#283141]">
                            ${flatTools.slice(0,5).map((t,i)=>`<tr class="hover:bg-white/5 cursor-pointer" onclick="showCategory('${t.key}')">
                                <td class="py-4 px-4 opacity-50 font-bold text-xl">${i+1}º</td>
                                <td class="py-4 font-semibold">${t.name}</td>
                                <td class="opacity-60 text-xs font-bold uppercase">${t.category}</td>
                                <td class="text-right px-4 font-black text-[#4CAF50] text-lg">${t.score.toFixed(1)}</td></tr>`).join('')}
                        </tbody>
                    </table></div>
                </div>
                <div class="mb-10">
                    <h3 class="text-xl font-bold mb-6 border-l-4 border-[#E53935] pl-3 uppercase tracking-wider">Melhor Ferramenta por Categoria</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${bestInCat.map(it=>`<div class="best-card" onclick="showCategory('${it.key}')">
                            <div><div class="text-[#A0B3D9] text-[10px] uppercase font-bold tracking-widest mb-1">${it.category}</div>
                            <div class="font-semibold">${it.name}</div></div>
                            <div class="bg-[#283141] text-[#4CAF50] px-3 py-1 rounded-md font-black">${it.score}</div></div>`).join('')}
                    </div>
                </div>`;

            dashCharts.forEach(c=>c.destroy()); dashCharts=[];
            Chart.defaults.color = '#A0B3D9'; Chart.defaults.font.family = 'Inter';
            dashCharts.push(new Chart(document.getElementById('distChart'), { type:'bar',
                data:{labels:catLabels, datasets:[{data:catCounts, backgroundColor:'#E53935', borderRadius:4}]},
                options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, grid:{color:'#283141'}}, x:{grid:{display:false}}}} }));
            dashCharts.push(new Chart(document.getElementById('perfChart'), { type:'radar',
                data:{labels:catLabels, datasets:[{data:catScores, borderColor:'#4CAF50', backgroundColor:'rgba(76,175,80,0.15)', pointBackgroundColor:'#4CAF50', borderWidth:2}]},
                options:{maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{r:{min:0,max:10,angleLines:{color:'#283141'},grid:{color:'#283141'},ticks:{display:false}}}} }));
        }

        function showCategory(key) {
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('analysis-view').classList.add('hidden');
            const view = document.getElementById('category-view');
            view.classList.remove('hidden');
            setActiveNav('nav-'+key);
            const cat = APP_DATA[key];
            const sorted = [...cat.tools].sort((a,b)=>parseFloat(getScore(b.matrix))-parseFloat(getScore(a.matrix)));
            view.innerHTML = `
                <header class="mb-10">
                    <h2 class="text-4xl font-bold text-[#E53935] flex items-center"><span class="mr-3">${cat.icon}</span> ${cat.title}</h2>
                    <p class="mt-2 text-lg opacity-80">${cat.desc}</p>
                </header>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                ${sorted.map(t=>{ const sc=getScore(t.matrix); const oi=cat.tools.findIndex(x=>x.name===t.name);
                    return `<div class="bg-[#131821] p-6 rounded-xl border border-[#283141] flex flex-col justify-between hover:border-[#E53935] transition-all shadow-md">
                        <div><div class="flex justify-between font-bold text-xl text-[#E53935] mb-3"><span>${t.name}</span>
                        ${sc!=='X'?'<span class="text-green-500">✓</span>':'<span class="text-red-500">✗</span>'}</div>
                        <p class="text-sm opacity-80 leading-relaxed">${t.description||''}</p></div>
                        <div class="mt-6"><div class="matrix-toggle" onclick="toggleMx(this,'${key}',${oi})">
                            Nota Geral: <span class="score-box ${scoreColor(sc)} ml-2">${sc}</span></div>
                            <div id="mx-${key}-${oi}" class="matrix-details">
                                <ul class="text-xs space-y-1.5 py-3 opacity-80 border-t border-white/5">
                                ${Object.entries(t.matrix).map(([k,v])=>`<li class="flex justify-between uppercase tracking-tighter"><span>${k.replace(/_/g,' ')}</span><span class="font-bold">${v}</span></li>`).join('')}
                                </ul>
                                <button onclick="showAnalysis('${key}',${oi})" class="w-full py-2 bg-[#E53935] rounded-lg text-sm font-bold shadow-md hover:bg-[#B71C1C] transition-colors mt-2">Ver Análise Completa</button>
                            </div></div></div>`; }).join('')}
                </div>`;
            window.scrollTo(0,0);
        }

        window.toggleMx = (btn,key,i)=>document.getElementById(`mx-${key}-${i}`).classList.toggle('show');

        function showAnalysis(key, idx) {
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('category-view').classList.add('hidden');
            const view = document.getElementById('analysis-view');
            view.classList.remove('hidden');
            const cat = APP_DATA[key]; const tool = cat.tools[idx];
            const sectionsHtml = (tool.fullAnalysis || "Sem análise detalhada disponível.").split('\n\n').map(s=>{
                if(s.includes('**')){ const lines=s.split('\n'); const title=lines[0].replace(/\*\*/g,'').trim(); const body=lines.slice(1).join('<br>').trim();
                    return `<div class="mb-8"><h4 class="text-2xl font-bold text-[#E53935] mb-3">${title}</h4><p class="opacity-90 leading-relaxed text-lg">${body}</p></div>`; }
                return `<p class="mb-6 opacity-90 leading-relaxed text-lg">${s.replace(/\n/g,'<br>')}</p>`;
            }).join('');
            view.innerHTML = `
                <button class="text-[#E53935] mb-6 font-bold flex items-center hover:translate-x-[-4px] transition-transform" onclick="showCategory('${key}')">
                    <span class="mr-2">←</span> Voltar para ${cat.title}</button>
                <h2 class="text-4xl font-bold text-[#E53935] mb-6">${tool.name}</h2>
                <div class="bg-[#131821] p-8 rounded-xl border border-[#283141]">
                    <div class="prose prose-invert max-w-none">${sectionsHtml}</div>
                    <div class="mt-10 pt-10 border-t border-[#283141]">
                        <h3 class="text-2xl font-bold mb-8 text-center">Matriz de Esforço Detalhada</h3>
                        <div class="chart-container mb-10 h-64"><canvas id="analysisChart"></canvas></div>
                        <ul class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-6">
                            <li class="flex justify-between font-extrabold border-b border-[#E53935]/30 pb-3 mb-2 col-span-full text-xl text-[#E53935]"><span>Nota Média:</span><span>${getScore(tool.matrix)}</span></li>
                            ${Object.entries(tool.matrix).map(([k,v])=>`<li class="flex justify-between p-3 bg-white/5 rounded-lg opacity-90"><span class="font-medium uppercase text-xs">${k.replace(/_/g,' ')}:</span><span class="font-bold">${v}</span></li>`).join('')}
                        </ul>
                    </div>
                    ${tool.url && tool.url!=='#' ? `<div class="flex justify-center mt-10"><a href="${tool.url}" target="_blank" class="bg-[#E53935] text-white px-10 py-3 rounded-lg font-bold text-lg hover:bg-[#B71C1C] transition-all transform hover:scale-105 shadow-lg">Visitar Site Oficial</a></div>`:''}
                </div>`;
            if(activeChart) activeChart.destroy();
            Chart.defaults.color='#A0B3D9'; Chart.defaults.font.family='Inter';
            activeChart = new Chart(document.getElementById('analysisChart'), { type:'bar',
                data:{labels:Object.keys(tool.matrix).map(x=>x.replace(/_/g,' ').toUpperCase()), datasets:[{data:Object.values(tool.matrix), backgroundColor:'#E53935', borderRadius:4}]},
                options:{indexAxis:'y', maintainAspectRatio:false, scales:{x:{max:10,ticks:{color:'#fff'},grid:{color:'#283141'}},y:{ticks:{color:'#fff'},grid:{display:false}}}, plugins:{legend:{display:false}}} });
            window.scrollTo(0,0);
        }

        document.addEventListener('DOMContentLoaded', ()=>{ buildNav(); showDashboard(); });
    </script>
</body>
</html>
